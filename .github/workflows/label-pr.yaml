# This workflow utilizes https://github.com/actions/github-script in GitHub Actions to apply labels to pull requests.
#
name: Label PR
# pull_request_target is required so the bot can label PRs from forks, but no
# PR code is ever checked out and the untrusted PR body is only read as a
# string for a regex match, never executed or interpolated into a shell
# command.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
  workflow_dispatch:
jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label PR
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        with:
          script: |-
            const keywords = [
              "breaking",
              "bug",
              "enhancement",
              "cleanup",
              "documentation"
            ];
            const prBody = context.payload.pull_request.body;
            const prLabels = [];
            if (prBody === null || prBody.trim() === "") {
              console.log("Pull Request body is empty");
              prLabels.push("other");
            } else {
              const regex = /^\s*\/kind\s+(.+)$/m;
              const match = prBody.match(regex);
              console.log(`PR body: '${prBody}'`);
              console.log(`Regex match: '${match}'`);
              if (match && keywords.includes(match[1])) {
                const label = match[1];
                console.log(`Adding label: '${label}' based on keyword '${label}' found in PR body.`);
                prLabels.push(label);
              } else {
                console.log(`Adding label: 'other' as no matching keyword found.`);
                prLabels.push("other");
              }
            }
            try {
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: prLabels
              });
            } catch (error) {
              console.error(`Error retrieving files: ${error}`);
            }
